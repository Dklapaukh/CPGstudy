# Daily check for a new EAS guidelines PDF (feature 6, Decisions D and Y).
# Downloads the PDF and runs scripts/check-pdf.js. When the export date or any guideline's
# version entry has changed, it rebuilds the content from the PDF (scripts/build-guidelines.js,
# no AI), rebuilds content/related.js, sets the date in version.json, runs `npm run check` and
# opens a pull request with all of it and a report. Nothing is published until you merge.
# When nothing has changed it confirms that the converter still rebuilds the recorded content.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: pdf-check
on:
  schedule:
    # 18:23 UTC is 7:23 am in New Zealand during daylight saving (6:23 am in winter).
    - cron: '23 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  check-pdf:
    # A fixed image, so a change of "ubuntu-latest" cannot break the pdftotext install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Download the EAS PDF
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/EAS.pdf" https://cpg.stjohn.org.nz/assets/pdf/EAS.pdf
      - name: Compare with the last scan
        id: scan
        run: node scripts/check-pdf.js "$RUNNER_TEMP/EAS.pdf" "$RUNNER_TEMP/report.md"
      # On a day with no new PDF: a red run here means the converter's output has changed (or the
      # PDF changed without a new export date), found before it can reach a content update.
      - name: Confirm the converter still gives the recorded content
        if: steps.scan.outputs.changed == 'false'
        run: |
          npm install
          node scripts/build-guidelines.js "$RUNNER_TEMP/EAS.pdf" --check
      - name: Check whether a pull request already exists for this PDF
        if: steps.scan.outputs.changed == 'true'
        id: branch
        env:
          EXPORTED_ON: ${{ steps.scan.outputs.exported_on }}
        run: |
          branch="pdf-update-${EXPORTED_ON//./-}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "A pull request branch for this PDF already exists: $branch"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the content from the PDF
        if: steps.scan.outputs.changed == 'true' && steps.branch.outputs.exists == 'false'
        run: |
          npm install
          node scripts/build-guidelines.js "$RUNNER_TEMP/EAS.pdf" "$RUNNER_TEMP/content-report.md"
          node scripts/build-related.js
          npx prettier --write content/pdf-status.json content/pdf-rebuild.json version.json
          # The result goes into the pull request; a failure does not stop the pull request.
          if npm run check > "$RUNNER_TEMP/check.log" 2>&1; then
            echo "passed" > "$RUNNER_TEMP/check-result"
          else
            echo "FAILED" > "$RUNNER_TEMP/check-result"
          fi
      - name: Open a pull request for the new PDF
        if: steps.scan.outputs.changed == 'true' && steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORTED_ON: ${{ steps.scan.outputs.exported_on }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/pdf-status.json content/pdf-rebuild.json content/guidelines.js \
            content/related.js version.json
          git commit -m "Guidelines rebuilt from the EAS PDF exported $EXPORTED_ON"
          git push origin "$BRANCH"
          {
            echo "A new EAS guidelines PDF was found and the content was rebuilt from it."
            echo "Nothing is published until this pull request is merged."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            cat "$RUNNER_TEMP/content-report.md"
            echo
            echo "### Automatic checks"
            echo "\`npm run check\` $(cat "$RUNNER_TEMP/check-result") on the rebuilt content."
            echo '<details><summary>Last lines of the check</summary>'
            echo
            echo '```'
            tail -n 25 "$RUNNER_TEMP/check.log"
            echo '```'
            echo '</details>'
            echo
            echo "### Before merging"
            echo "- [ ] Read the changes to each guideline under \"Check formatting\" (Files changed,"
            echo "      content/guidelines.js); after merging, open them in the app and compare with the PDF."
            echo "- [ ] Check the section of any new guideline."
            echo "- [ ] Merge. Phones then show \"A new version of the guidelines is available\"."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --head "$BRANCH" --title "New EAS guidelines PDF ($EXPORTED_ON)" \
            --body-file "$RUNNER_TEMP/body.md"
